<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese Classifier Whack-a-Mole - SLP Deluxe Edition</title>
  <!-- html2canvas for exporting performance report as image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #3A7CA5;
      --secondary: #48BB78;
      --accent: #E53E3E;
      --text: #2D3748;
    }

    body {
      font-family: "PingFang HK", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F7F6;
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    h1 {
      margin: 5px 0 12px 0;
      color: #2D6A4F;
      text-align: center;
      font-size: 1.8rem;
    }

    .setup-panel, .tracker-panel {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      max-width: 640px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #E2E8F0;
    }

    .form-group { margin-bottom: 16px; }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
      color: #2D6A4F;
    }

    .radio-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .radio-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #F0F7F4;
      border: 2px solid #B7E4C7;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2D6A4F;
      transition: all 0.2s ease;
    }

    .radio-btn input { display: none; }

    .radio-btn.selected {
      background: #52B788;
      color: white;
      border-color: #2D6A4F;
      box-shadow: 0 4px 10px rgba(82, 183, 136, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      background: #40916C;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(64, 145, 108, 0.3);
    }

    button:hover { background: #2D6A4F; }

    /* Game Environment Container */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 520px;
      background: linear-gradient(to bottom, #C0E8F9 0%, #E2F0D9 35%, #95D5B2 100%);
      border-radius: 20px;
      border: 6px solid #74C69D;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      margin-bottom: 15px;
    }

    /* Hole Locations with strict Z-index stacking */
    .mole-spot {
      position: absolute;
      width: 140px;
      height: 240px;
    }

    .spot-0 { top: 120px; left: 6%; z-index: 5; }
    .spot-1 { top: 110px; right: 8%; z-index: 5; }
    .spot-2 { top: 200px; left: 36%; z-index: 6; }
    .spot-3 { top: 260px; left: 10%; z-index: 7; }
    .spot-4 { top: 270px; right: 12%; z-index: 7; }

    /* Fix clipping: wrapper expands high enough so cards are never sliced off */
    .clipping-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 10;
    }

    .hole-mound {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 46px;
      background: radial-gradient(ellipse at center, #5C3D2E 0%, #3D2314 100%);
      border-radius: 50%;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.8), 0 4px 0 #2D6A4F;
      z-index: 2;
    }

    .grass-tuft {
      position: absolute;
      bottom: 4px;
      width: 100%;
      height: 14px;
      z-index: 12;
      pointer-events: none;
    }

    .grass-tuft::before, .grass-tuft::after {
      content: '';
      position: absolute;
      bottom: 0;
      background: #1B4332;
      border-radius: 10px 10px 0 0;
    }
    .grass-tuft::before { left: 8px; width: 7px; height: 16px; transform: rotate(-20deg); }
    .grass-tuft::after { right: 10px; width: 7px; height: 18px; transform: rotate(20deg); }

    /* MOLE CHARACTER */
    .mole {
      position: absolute;
      bottom: -180px;
      left: 33px;
      width: 74px;
      height: 180px; /* Tall enough to house card + mole body seamlessly */
      background: linear-gradient(to right, #8D6E63, #5D4037);
      border-radius: 37px 37px 12px 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      box-shadow: inset -5px -4px 0 rgba(0,0,0,0.3);
    }

    .mole.up {
      transform: translateY(-190px);
      opacity: 1;
      pointer-events: auto;
    }

    .mole-card-wrapper {
      position: absolute;
      top: -65px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }

    /* CARD: Image Only - Clean & Unobscured */
    .mole-card {
      width: 82px;
      height: 82px;
      background: #FFFFFF;
      border: 4px solid var(--primary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      padding: 4px;
      box-sizing: border-box;
      pointer-events: auto;
    }

    .mole-stick {
      width: 6px;
      height: 24px;
      background: #8D5B4C;
      border-radius: 2px;
      margin-top: -2px;
    }

    .mole-canvas {
      width: 70px;
      height: 70px;
      display: block;
    }

    /* FACIAL FEATURES */
    .mole-ear {
      position: absolute;
      top: 25px;
      width: 12px;
      height: 14px;
      background: #D7CCC8;
      border-radius: 50%;
      border: 2px solid #5D4037;
    }
    .mole-ear.left { left: -3px; }
    .mole-ear.right { right: -3px; }

    .mole-eyes-container {
      position: absolute;
      top: 40px;
      width: 44px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }

    .mole-eye {
      width: 9px;
      height: 9px;
      background: #111;
      border-radius: 50%;
      position: relative;
    }
    
    .mole-eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
    }

    .mole-snout {
      width: 36px;
      height: 22px;
      background: #E0D6D3;
      border-radius: 14px;
      margin-top: 50px;
      position: relative;
      display: flex;
      justify-content: center;
      z-index: 3;
    }

    .mole-nose {
      width: 12px;
      height: 9px;
      background: #FFB5A7;
      border-radius: 6px;
      position: absolute;
      top: 2px;
    }

    /* Whack FX */
    .hit-fx {
      position: absolute;
      top: -60px;
      font-size: 2rem;
      font-weight: bold;
      pointer-events: none;
      animation: popAndFade 0.6s forwards;
      z-index: 30;
    }
    .hit-fx.correct { color: #2ECC71; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .hit-fx.wrong { color: #E53E3E; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }

    @keyframes popAndFade {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-35px) scale(1.3); }
    }

    /* Scoreboard & Controls */
    .game-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      width: 100%;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .score-badge {
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #52B788;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>打地鼠量詞識別遊戲</h1>

  <!-- Setup Panel -->
  <div id="setup-panel" class="setup-panel">
    <div class="form-group">
      <label>1. 選擇目標量詞 (Target Classifier)：</label>
      <div class="radio-group" id="classifier-options">
        <label class="radio-btn selected"><input type="radio" name="classifier" value="個" checked>個</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="條">條</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="件">件</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="隻">隻</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="粒">粒</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="架">架</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="張">張</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="塊">塊</label>
      </div>
    </div>

    <button id="start-btn">開始遊戲 Start Game</button>
  </div>

  <!-- Game Controls Bar -->
  <div id="game-controls" class="game-controls hidden">
    <button id="reset-btn" style="width: auto; padding: 6px 16px; font-size: 0.9rem;">← 返回設定 Setup</button>
    <div class="score-badge">目標量詞: <span id="target-display" style="color:#2D6A4F;">-</span></div>
    <div class="score-badge">得分: <span id="score-display" style="color:var(--primary);">0</span></div>
    <div class="score-badge">剩餘時間: <span id="timer-display" style="color:var(--accent);">45</span>s</div>
  </div>

  <!-- Game Field -->
  <div id="game-container" class="game-container hidden">
    <div class="mole-spot spot-0">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-0">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <canvas class="mole-canvas" id="canvas-0" width="120" height="120"></canvas>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-1">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-1">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <canvas class="mole-canvas" id="canvas-1" width="120" height="120"></canvas>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-2">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-2">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <canvas class="mole-canvas" id="canvas-2" width="120" height="120"></canvas>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-3">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-3">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <canvas class="mole-canvas" id="canvas-3" width="120" height="120"></canvas>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-4">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-4">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <canvas class="mole-canvas" id="canvas-4" width="120" height="120"></canvas>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>
  </div>

  <!-- Tracker Panel -->
  <div id="tracker-panel" class="tracker-panel hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #BBF7D0; padding-bottom:8px; margin-bottom:14px;">
      <h2 style="margin:0; font-size:1.25rem; color:#2D6A4F;">紀錄面板 (Data Tracker)</h2>
      <button id="export-img-btn" style="width:auto; padding:6px 14px; font-size:0.85rem; background:#276749;">📷 匯出紀錄圖片 (Export Image)</button>
    </div>

    <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
      <label for="child-name" style="margin: 0; white-space: nowrap;">學生/兒童名字 (Name):</label>
      <input type="text" id="child-name" placeholder="請輸入名字..." style="padding: 6px 10px; width: 100%; border-radius: 6px; border: 1px solid #CCC;">
    </div>

    <div id="summary-box" style="background:white; padding:14px; border-radius:10px; font-weight:bold; font-size:0.95rem; border:1px dashed #38A169; line-height:1.6;">遊戲尚未完成</div>
  </div>

  <script>
    // Pure Drawing Database (Renders HTML5 Canvas Vector Graphics directly)
    const itemsDatabase = {
      '個': [
        { name: '蘋果', draw: drawApple },
        { name: '橙', draw: drawOrange },
        { name: '蛋糕', draw: drawCake },
        { name: '波', draw: drawBall },
        { name: '鐘', draw: drawClock }
      ],
      '條': [
        { name: '魚', draw: drawFish },
        { name: '香蕉', draw: drawBanana },
        { name: '褲', draw: drawPants },
        { name: '彩虹', draw: drawRainbow },
        { name: '蛇', draw: drawSnake }
      ],
      '件': [
        { name: '衫', draw: drawShirt },
        { name: '外套', draw: drawJacket },
        { name: '泳衣', draw: drawSwimsuit }
      ],
      '隻': [
        { name: '狗', draw: drawDog },
        { name: '貓', draw: drawCat },
        { name: '雀仔', draw: drawBird },
        { name: '烏龜', draw: drawTurtle }
      ],
      '粒': [
        { name: '糖', draw: drawCandy },
        { name: '草莓', draw: drawStrawberry },
        { name: '車厘子', draw: drawCherry }
      ],
      '架': [
        { name: '車', draw: drawCar },
        { name: '飛機', draw: drawAirplane },
        { name: '單車', draw: drawBicycle }
      ],
      '張': [
        { name: '紙', draw: drawPaper },
        { name: '櫈', draw: drawChair },
        { name: '床', draw: drawBed }
      ],
      '塊': [
        { name: '餅乾', draw: drawCookie },
        { name: '披薩', draw: drawPizza },
        { name: '樹葉', draw: drawLeaf }
      ]
    };

    // Vector Graphics Drawing Functions
    function drawApple(ctx) {
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.arc(45, 65, 30, 0, Math.PI * 2);
      ctx.arc(75, 65, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#38A169';
      ctx.beginPath();
      ctx.ellipse(60, 30, 8, 16, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawOrange(ctx) {
      ctx.fillStyle = '#ED8936';
      ctx.beginPath();
      ctx.arc(60, 65, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#38A169';
      ctx.beginPath();
      ctx.arc(60, 22, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCake(ctx) {
      ctx.fillStyle = '#ED8936';
      ctx.fillRect(25, 60, 70, 35);
      ctx.fillStyle = '#FFF5F5';
      ctx.fillRect(25, 45, 70, 15);
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.arc(60, 35, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBall(ctx) {
      ctx.fillStyle = '#3182CE';
      ctx.beginPath();
      ctx.arc(60, 60, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(60, 60, 42, 0, Math.PI);
      ctx.stroke();
    }

    function drawClock(ctx) {
      ctx.fillStyle = '#EDF2F7';
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(60, 60, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(60, 60);
      ctx.lineTo(60, 32);
      ctx.moveTo(60, 60);
      ctx.lineTo(80, 60);
      ctx.stroke();
    }

    function drawFish(ctx) {
      ctx.fillStyle = '#4299E1';
      ctx.beginPath();
      ctx.ellipse(55, 60, 35, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(85, 60);
      ctx.lineTo(110, 40);
      ctx.lineTo(110, 80);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(35, 52, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBanana(ctx) {
      ctx.fillStyle = '#ECC94B';
      ctx.beginPath();
      ctx.arc(60, 40, 45, 0.2 * Math.PI, 0.9 * Math.PI);
      ctx.lineWidth = 18;
      ctx.strokeStyle = '#ECC94B';
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function drawPants(ctx) {
      ctx.fillStyle = '#2B6CB0';
      ctx.beginPath();
      ctx.moveTo(30, 25);
      ctx.lineTo(90, 25);
      ctx.lineTo(82, 95);
      ctx.lineTo(62, 95);
      ctx.lineTo(60, 50);
      ctx.lineTo(58, 95);
      ctx.lineTo(38, 95);
      ctx.closePath();
      ctx.fill();
    }

    function drawRainbow(ctx) {
      const colors = ['#E53E3E', '#ECC94B', '#3182CE'];
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = colors[i];
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(60, 85, 45 - i * 11, Math.PI, 0);
        ctx.stroke();
      }
    }

    function drawSnake(ctx) {
      ctx.strokeStyle = '#38A169';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(25, 75);
      ctx.bezierCurveTo(40, 35, 80, 85, 95, 45);
      ctx.stroke();
    }

    function drawShirt(ctx) {
      ctx.fillStyle = '#319795';
      ctx.beginPath();
      ctx.moveTo(40, 25);
      ctx.lineTo(80, 25);
      ctx.lineTo(105, 45);
      ctx.lineTo(90, 60);
      ctx.lineTo(80, 50);
      ctx.lineTo(80, 95);
      ctx.lineTo(40, 95);
      ctx.lineTo(40, 50);
      ctx.lineTo(30, 60);
      ctx.lineTo(15, 45);
      ctx.closePath();
      ctx.fill();
    }

    function drawJacket(ctx) {
      ctx.fillStyle = '#2C5282';
      ctx.fillRect(30, 25, 60, 70);
      ctx.fillStyle = '#ECC94B';
      ctx.fillRect(57, 25, 6, 70);
    }

    function drawSwimsuit(ctx) {
      ctx.fillStyle = '#ED64A6';
      ctx.beginPath();
      ctx.moveTo(40, 25);
      ctx.lineTo(80, 25);
      ctx.lineTo(75, 60);
      ctx.lineTo(68, 95);
      ctx.lineTo(52, 95);
      ctx.lineTo(45, 60);
      ctx.closePath();
      ctx.fill();
    }

    function drawDog(ctx) {
      ctx.fillStyle = '#ED8936';
      ctx.beginPath();
      ctx.arc(60, 60, 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#C05621';
      ctx.beginPath();
      ctx.ellipse(28, 55, 10, 20, 0.2, 0, Math.PI * 2);
      ctx.ellipse(92, 55, 10, 20, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2D3748';
      ctx.beginPath();
      ctx.arc(60, 66, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCat(ctx) {
      ctx.fillStyle = '#A0AEC0';
      ctx.beginPath();
      ctx.arc(60, 65, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(35, 45);
      ctx.lineTo(30, 20);
      ctx.lineTo(50, 38);
      ctx.moveTo(85, 45);
      ctx.lineTo(90, 20);
      ctx.lineTo(70, 38);
      ctx.fill();
    }

    function drawBird(ctx) {
      ctx.fillStyle = '#3182CE';
      ctx.beginPath();
      ctx.arc(55, 60, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ED8936';
      ctx.beginPath();
      ctx.moveTo(78, 55);
      ctx.lineTo(102, 60);
      ctx.lineTo(78, 68);
      ctx.closePath();
      ctx.fill();
    }

    function drawTurtle(ctx) {
      ctx.fillStyle = '#38A169';
      ctx.beginPath();
      ctx.arc(60, 60, 32, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#48BB78';
      ctx.beginPath();
      ctx.arc(94, 60, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCandy(ctx) {
      ctx.fillStyle = '#ED64A6';
      ctx.beginPath();
      ctx.arc(60, 60, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(38, 60);
      ctx.lineTo(18, 42);
      ctx.lineTo(18, 78);
      ctx.closePath();
      ctx.moveTo(82, 60);
      ctx.lineTo(102, 42);
      ctx.lineTo(102, 78);
      ctx.closePath();
      ctx.fill();
    }

    function drawStrawberry(ctx) {
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.moveTo(60, 95);
      ctx.bezierCurveTo(20, 70, 25, 35, 60, 35);
      ctx.bezierCurveTo(95, 35, 100, 70, 60, 95);
      ctx.fill();
      ctx.fillStyle = '#38A169';
      ctx.fillRect(50, 22, 20, 14);
    }

    function drawCherry(ctx) {
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.arc(42, 75, 18, 0, Math.PI * 2);
      ctx.arc(78, 75, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#276749';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(42, 60);
      ctx.quadraticCurveTo(60, 25, 60, 25);
      ctx.moveTo(78, 60);
      ctx.quadraticCurveTo(60, 25, 60, 25);
      ctx.stroke();
    }

    function drawCar(ctx) {
      ctx.fillStyle = '#E53E3E';
      ctx.fillRect(20, 55, 80, 25);
      ctx.fillRect(38, 35, 44, 20);
      ctx.fillStyle = '#2D3748';
      ctx.beginPath();
      ctx.arc(38, 80, 10, 0, Math.PI * 2);
      ctx.arc(82, 80, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawAirplane(ctx) {
      ctx.fillStyle = '#CBD5E0';
      ctx.beginPath();
      ctx.ellipse(60, 60, 45, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#A0AEC0';
      ctx.beginPath();
      ctx.moveTo(50, 60);
      ctx.lineTo(65, 20);
      ctx.lineTo(75, 20);
      ctx.lineTo(65, 60);
      ctx.closePath();
      ctx.fill();
    }

    function drawBicycle(ctx) {
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(35, 70, 18, 0, Math.PI * 2);
      ctx.arc(85, 70, 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#E53E3E';
      ctx.beginPath();
      ctx.moveTo(35, 70);
      ctx.lineTo(55, 45);
      ctx.lineTo(75, 70);
      ctx.stroke();
    }

    function drawPaper(ctx) {
      ctx.fillStyle = '#EDF2F7';
      ctx.strokeStyle = '#CBD5E0';
      ctx.lineWidth = 3;
      ctx.fillRect(35, 25, 50, 70);
      ctx.strokeRect(35, 25, 50, 70);
    }

    function drawChair(ctx) {
      ctx.fillStyle = '#DD6B20';
      ctx.fillRect(35, 50, 50, 10);
      ctx.fillRect(35, 20, 10, 40);
      ctx.fillRect(40, 60, 8, 35);
      ctx.fillRect(72, 60, 8, 35);
    }

    function drawBed(ctx) {
      ctx.fillStyle = '#3182CE';
      ctx.fillRect(20, 55, 80, 20);
      ctx.fillStyle = '#EDF2F7';
      ctx.fillRect(25, 42, 25, 13);
      ctx.fillStyle = '#744210';
      ctx.fillRect(15, 35, 8, 45);
    }

    function drawCookie(ctx) {
      ctx.fillStyle = '#D69E2E';
      ctx.beginPath();
      ctx.arc(60, 60, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#744210';
      const spots = [[45,48], [72,52], [55,75], [70,72], [42,68]];
      spots.forEach(p => {
        ctx.beginPath();
        ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawPizza(ctx) {
      ctx.fillStyle = '#F6AD55';
      ctx.beginPath();
      ctx.moveTo(60, 20);
      ctx.lineTo(25, 90);
      ctx.lineTo(95, 90);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.arc(50, 60, 5, 0, Math.PI * 2);
      ctx.arc(70, 75, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLeaf(ctx) {
      ctx.fillStyle = '#48BB78';
      ctx.beginPath();
      ctx.moveTo(30, 90);
      ctx.quadraticCurveTo(20, 30, 90, 30);
      ctx.quadraticCurveTo(90, 90, 30, 90);
      ctx.fill();
    }

    // Game Logic Engine
    let targetClassifier = '個';
    let score = 0;
    let timeLeft = 45;
    let gameTimer = null;
    let spawnTimer = null;
    let activeMoles = {};
    let trackedSessionData = {};

    const setupPanel = document.getElementById('setup-panel');
    const gameControls = document.getElementById('game-controls');
    const gameContainer = document.getElementById('game-container');
    const trackerPanel = document.getElementById('tracker-panel');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const exportImgBtn = document.getElementById('export-img-btn');
    const targetDisplay = document.getElementById('target-display');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const summaryBox = document.getElementById('summary-box');
    const childNameInput = document.getElementById('child-name');

    const radioLabels = document.querySelectorAll('#classifier-options .radio-btn');
    radioLabels.forEach(label => {
      label.addEventListener('click', () => {
        radioLabels.forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        const radioInput = label.querySelector('input');
        radioInput.checked = true;
        targetClassifier = radioInput.value;
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', stopAndResetToSetup);
    exportImgBtn.addEventListener('click', exportTrackerAsImage);

    for (let i = 0; i < 5; i++) {
      const moleElem = document.getElementById(`mole-${i}`);
      moleElem.addEventListener('click', () => whackMole(i));
    }

    function startGame() {
      score = 0;
      timeLeft = 45;
      activeMoles = {};
      trackedSessionData = {};

      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      targetDisplay.textContent = targetClassifier;

      setupPanel.classList.add('hidden');
      gameControls.classList.remove('hidden');
      gameContainer.classList.remove('hidden');
      trackerPanel.classList.remove('hidden');

      summaryBox.innerHTML = '🎮 遊戲進行中... (In Progress)';

      gameTimer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnLoop();
    }

    function spawnLoop() {
      if (timeLeft <= 0) return;

      popRandomMole();
      const delay = Math.floor(Math.random() * 600) + 700; 
      spawnTimer = setTimeout(spawnLoop, delay);
    }

    function popRandomMole() {
      const availableHoles = [];
      for (let i = 0; i < 5; i++) {
        if (!activeMoles[i]) availableHoles.push(i);
      }

      if (availableHoles.length === 0) return;

      const holeIndex = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      
      const isTarget = Math.random() < 0.6;
      let chosenClassifier = targetClassifier;

      if (!isTarget) {
        const otherClassifiers = Object.keys(itemsDatabase).filter(c => c !== targetClassifier);
        chosenClassifier = otherClassifiers[Math.floor(Math.random() * otherClassifiers.length)];
      }

      const pool = itemsDatabase[chosenClassifier];
      const pickedItem = pool[Math.floor(Math.random() * pool.length)];

      const moleElem = document.getElementById(`mole-${holeIndex}`);
      const canvasElem = document.getElementById(`canvas-${holeIndex}`);
      const ctx = canvasElem.getContext('2d');

      ctx.clearRect(0, 0, 120, 120);
      pickedItem.draw(ctx);

      activeMoles[holeIndex] = {
        item: pickedItem,
        classifier: chosenClassifier,
        isTarget: isTarget,
        hit: false
      };

      moleElem.classList.add('up');

      setTimeout(() => {
        if (activeMoles[holeIndex] && !activeMoles[holeIndex].hit) {
          moleElem.classList.remove('up');
          delete activeMoles[holeIndex];
        }
      }, 1800);
    }

    function whackMole(holeIndex) {
      const moleData = activeMoles[holeIndex];
      if (!moleData || moleData.hit) return;

      moleData.hit = true;
      const moleElem = document.getElementById(`mole-${holeIndex}`);

      const fullText = `一${moleData.classifier}${moleData.item.name}`;
      if (!trackedSessionData[fullText]) {
        trackedSessionData[fullText] = { 
          name: moleData.item.name, 
          classifier: moleData.classifier, 
          isTarget: moleData.isTarget, 
          hits: 0, 
          wrongHits: 0 
        };
      }

      if (moleData.isTarget) {
        score += 1;
        trackedSessionData[fullText].hits += 1;
        showHitFx(holeIndex, '+1', true);
      } else {
        score = Math.max(0, score - 1);
        trackedSessionData[fullText].wrongHits += 1;
        showHitFx(holeIndex, '-1', false);
      }

      scoreDisplay.textContent = score;

      moleElem.classList.remove('up');
      delete activeMoles[holeIndex];
    }

    function showHitFx(holeIndex, text, isCorrect) {
      const spotElem = document.querySelector(`.spot-${holeIndex}`);
      const fx = document.createElement('div');
      fx.className = `hit-fx ${isCorrect ? 'correct' : 'wrong'}`;
      fx.textContent = text;
      spotElem.appendChild(fx);

      setTimeout(() => fx.remove(), 600);
    }

    function endGame() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      renderTrackerSummary();
    }

    function stopAndResetToSetup() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      gameContainer.classList.add('hidden');
      gameControls.classList.add('hidden');
      trackerPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    }

    function renderTrackerSummary() {
      let targetHits = 0;
      let distractorHits = 0;
      let targetItemsList = [];

      Object.values(trackedSessionData).forEach(entry => {
        if (entry.isTarget) {
          targetHits += entry.hits;
          if (entry.hits > 0) {
            targetItemsList.push(`一${entry.classifier}${entry.name} (${entry.hits}次)`);
          }
        } else {
          distractorHits += entry.wrongHits;
        }
      });

      const totalAttempts = targetHits + distractorHits;
      const accuracy = totalAttempts > 0 ? Math.round((targetHits / totalAttempts) * 100) : 0;

      let html = `<div>🏆 <b>遊戲完成！最終得分：${score} 分</b></div>`;
      html += `<div>🎯 目標量詞：「<b>${targetClassifier}</b>」</div>`;
      html += `<div>📊 辨識正確率：<b>${targetHits}/${totalAttempts} (${accuracy}%)</b></div>`;
      
      if (targetItemsList.length > 0) {
        html += `<div style="margin-top:6px; font-weight:normal; color:#2D6A4F; font-size:0.88rem;">成功擊中之目標詞彙：${targetItemsList.join('、')}</div>`;
      }
      
      if (distractorHits > 0) {
        html += `<div style="margin-top:4px; font-weight:normal; color:#E53E3E; font-size:0.88rem;">誤擊非目標量詞次數：${distractorHits} 次</div>`;
      }

      summaryBox.innerHTML = html;
    }

    function exportTrackerAsImage() {
      const name = childNameInput.value.trim() || '未命名';
      
      html2canvas(trackerPanel, {
        useCORS: true,
        scale: 2,
        backgroundColor: '#FFFFFF'
      }).then(canvas => {
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        link.download = `打地鼠量詞紀錄_${name}_${dateStr}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => {
        alert('匯出圖片時發生錯誤，請稍後再試。');
      });
    }
  </script>
</body>
</html>
