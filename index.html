<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese Classifier Whack-a-Mole - SLP Deluxe Edition</title>
  <!-- html2canvas for exporting performance report as image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #3A7CA5;
      --secondary: #48BB78;
      --accent: #E53E3E;
      --text: #2D3748;
    }

    body {
      font-family: "PingFang HK", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F7F6;
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    h1 {
      margin: 5px 0 12px 0;
      color: #2D6A4F;
      text-align: center;
      font-size: 1.8rem;
    }

    .setup-panel, .tracker-panel {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      max-width: 640px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #E2E8F0;
    }

    .form-group { margin-bottom: 16px; }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
      color: #2D6A4F;
    }

    .radio-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .radio-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #F0F7F4;
      border: 2px solid #B7E4C7;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2D6A4F;
      transition: all 0.2s ease;
    }

    .radio-btn input { display: none; }

    .radio-btn.selected {
      background: #52B788;
      color: white;
      border-color: #2D6A4F;
      box-shadow: 0 4px 10px rgba(82, 183, 136, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      background: #40916C;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(64, 145, 108, 0.3);
    }

    button:hover { background: #2D6A4F; }

    /* Game Environment Container */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 520px;
      background: linear-gradient(to bottom, #C0E8F9 0%, #E2F0D9 35%, #95D5B2 100%);
      border-radius: 20px;
      border: 6px solid #74C69D;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      margin-bottom: 15px;
    }

    /* Hole Locations with strict Z-index stacking */
    .mole-spot {
      position: absolute;
      width: 140px;
      height: 240px;
    }

    .spot-0 { top: 120px; left: 6%; z-index: 5; }
    .spot-1 { top: 110px; right: 8%; z-index: 5; }
    .spot-2 { top: 200px; left: 36%; z-index: 6; }
    .spot-3 { top: 260px; left: 10%; z-index: 7; }
    .spot-4 { top: 270px; right: 12%; z-index: 7; }

    .clipping-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 10;
    }

    .hole-mound {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 46px;
      background: radial-gradient(ellipse at center, #5C3D2E 0%, #3D2314 100%);
      border-radius: 50%;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.8), 0 4px 0 #2D6A4F;
      z-index: 2;
    }

    .grass-tuft {
      position: absolute;
      bottom: 4px;
      width: 100%;
      height: 14px;
      z-index: 12;
      pointer-events: none;
    }

    .grass-tuft::before, .grass-tuft::after {
      content: '';
      position: absolute;
      bottom: 0;
      background: #1B4332;
      border-radius: 10px 10px 0 0;
    }
    .grass-tuft::before { left: 8px; width: 7px; height: 16px; transform: rotate(-20deg); }
    .grass-tuft::after { right: 10px; width: 7px; height: 18px; transform: rotate(20deg); }

    /* MOLE CHARACTER */
    .mole {
      position: absolute;
      bottom: -180px;
      left: 33px;
      width: 74px;
      height: 180px;
      background: linear-gradient(to right, #8D6E63, #5D4037);
      border-radius: 37px 37px 12px 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      box-shadow: inset -5px -4px 0 rgba(0,0,0,0.3);
    }

    .mole.up {
      transform: translateY(-190px);
      opacity: 1;
      pointer-events: auto;
    }

    .mole-card-wrapper {
      position: absolute;
      top: -65px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }

    /* CARD: Image Only Display */
    .mole-card {
      width: 82px;
      height: 82px;
      background: #FFFFFF;
      border: 4px solid var(--primary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      padding: 6px;
      box-sizing: border-box;
      pointer-events: auto;
    }

    .mole-stick {
      width: 6px;
      height: 24px;
      background: #8D5B4C;
      border-radius: 2px;
      margin-top: -2px;
    }

    .mole-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* FACIAL FEATURES */
    .mole-ear {
      position: absolute;
      top: 25px;
      width: 12px;
      height: 14px;
      background: #D7CCC8;
      border-radius: 50%;
      border: 2px solid #5D4037;
    }
    .mole-ear.left { left: -3px; }
    .mole-ear.right { right: -3px; }

    .mole-eyes-container {
      position: absolute;
      top: 40px;
      width: 44px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }

    .mole-eye {
      width: 9px;
      height: 9px;
      background: #111;
      border-radius: 50%;
      position: relative;
    }
    
    .mole-eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
    }

    .mole-snout {
      width: 36px;
      height: 22px;
      background: #E0D6D3;
      border-radius: 14px;
      margin-top: 50px;
      position: relative;
      display: flex;
      justify-content: center;
      z-index: 3;
    }

    .mole-nose {
      width: 12px;
      height: 9px;
      background: #FFB5A7;
      border-radius: 6px;
      position: absolute;
      top: 2px;
    }

    /* Whack FX */
    .hit-fx {
      position: absolute;
      top: -60px;
      font-size: 2rem;
      font-weight: bold;
      pointer-events: none;
      animation: popAndFade 0.6s forwards;
      z-index: 30;
    }
    .hit-fx.correct { color: #2ECC71; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .hit-fx.wrong { color: #E53E3E; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }

    @keyframes popAndFade {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-35px) scale(1.3); }
    }

    /* Scoreboard & Controls */
    .game-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      width: 100%;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .score-badge {
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #52B788;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>打地鼠量詞識別遊戲</h1>

  <!-- Setup Panel -->
  <div id="setup-panel" class="setup-panel">

        <label class="radio-btn"><input type="radio" name="classifier" value="件">件</label>

          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>

            </div>

          </div>

      airplane: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="40" ry="10" fill="%23CBD5E0"/><polygon points="40,50 55,18 65,18 55,50" fill="%23A0AEC0"/></svg>`,
      bicycle: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="30" cy="60" r="16" stroke="%232D3748" stroke-width="5" fill="none"/><circle cx="70" cy="60" r="16" stroke="%232D3748" stroke-width="5" fill="none"/><path d="M30 60 L45 38 L65 60 M45 38 L60 38" stroke="%23E53E3E" stroke-width="5" fill="none"/></svg>`,
      paper: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="25" y="15" width="50" height="70" rx="3" fill="%23EDF2F7" stroke="%23CBD5E0" stroke-width="3"/><line x1="35" y1="30" x2="65" y2="30" stroke="%23A0AEC0" stroke-width="3"/><line x1="35" y1="45" x2="65" y2="45" stroke="%23A0AEC0" stroke-width="3"/></svg>`,
      chair: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="30" y="45" width="40" height="8" rx="2" fill="%23DD6B20"/><rect x="30" y="20" width="8" height="30" fill="%23DD6B20"/><rect x="34" y="53" width="6" height="30" fill="%23744210"/><rect x="60" y="53" width="6" height="30" fill="%23744210"/></svg>`,
      bed: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="15" y="50" width="70" height="18" fill="%233182CE"/><rect x="20" y="38" width="20" height="12" rx="2" fill="%23EDF2F7"/><rect x="10" y="30" width="6" height="42" fill="%23744210"/></svg>`,
      cookie: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="32" fill="%23D69E2E"/><circle cx="38" cy="40" r="4" fill="%23744210"/><circle cx="62" cy="42" r="4" fill="%23744210"/><circle cx="48" cy="62" r="4" fill="%23744210"/><circle cx="60" cy="58" r="4" fill="%23744210"/></svg>`,
      pizza: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,15 20,80 80,80" fill="%23F6AD55"/><circle cx="42" cy="50" r="4" fill="%23E53E3E"/><circle cx="58" cy="65" r="4" fill="%23E53E3E"/></svg>`,
      leaf: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M25 75 Q 20 25 75 25 Q 75 75 25 75 Z" fill="%2348BB78"/><path d="M25 75 L75 25" stroke="%23276749" stroke-width="3"/></svg>`
    };

    const itemsDatabase = {
      '個': [
        { name: '蘋果', src: SVG.apple },
        { name: '橙', src: SVG.orange },
        { name: '蛋糕', src: SVG.cake },
        { name: '波', src: SVG.ball },
        { name: '鐘', src: SVG.clock }
      ],
      '條': [
        { name: '魚', src: SVG.fish },
        { name: '香蕉', src: SVG.banana },
        { name: '褲', src: SVG.pants },
        { name: '彩虹', src: SVG.rainbow },
        { name: '蛇', src: SVG.snake }
      ],
      '件': [
        { name: '衫', src: SVG.shirt },
        { name: '外套', src: SVG.jacket },
        { name: '泳衣', src: SVG.swimsuit }
      ],
      '隻': [
        { name: '狗', src: SVG.dog },
        { name: '貓', src: SVG.cat },
        { name: '雀仔', src: SVG.bird },
        { name: '烏龜', src: SVG.turtle }
      ],
      '粒': [
        { name: '糖', src: SVG.candy },
        { name: '草莓', src: SVG.strawberry },
        { name: '車厘子', src: SVG.cherry }
      ],
      '架': [
        { name: '車', src: SVG.car },
        { name: '飛機', src: SVG.airplane },
        { name: '單車', src: SVG.bicycle }
      ],
      '張': [
        { name: '紙', src: SVG.paper },
        { name: '櫈', src: SVG.chair },
        { name: '床', src: SVG.bed }
      ],
      '塊': [
        { name: '餅乾', src: SVG.cookie },
        { name: '披薩', src: SVG.pizza },
        { name: '樹葉', src: SVG.leaf }
      ]
    };

    // Game Logic Engine
    let targetClassifier = '個';
    let score = 0;
    let timeLeft = 45;
    let gameTimer = null;
    let spawnTimer = null;
    let activeMoles = {};
    let trackedSessionData = {};

    const setupPanel = document.getElementById('setup-panel');
    const gameControls = document.getElementById('game-controls');
    const gameContainer = document.getElementById('game-container');
    const trackerPanel = document.getElementById('tracker-panel');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const exportImgBtn = document.getElementById('export-img-btn');
    const targetDisplay = document.getElementById('target-display');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const summaryBox = document.getElementById('summary-box');
    const childNameInput = document.getElementById('child-name');

    const radioLabels = document.querySelectorAll('#classifier-options .radio-btn');
    radioLabels.forEach(label => {
      label.addEventListener('click', () => {
        radioLabels.forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        const radioInput = label.querySelector('input');
        radioInput.checked = true;
        targetClassifier = radioInput.value;
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', stopAndResetToSetup);
    exportImgBtn.addEventListener('click', exportTrackerAsImage);

    for (let i = 0; i < 5; i++) {
      const moleElem = document.getElementById(`mole-${i}`);
      moleElem.addEventListener('click', () => whackMole(i));
    }

    function startGame() {
      score = 0;
      timeLeft = 45;
      activeMoles = {};
      trackedSessionData = {};

      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      targetDisplay.textContent = targetClassifier;

      setupPanel.classList.add('hidden');
      gameControls.classList.remove('hidden');
      gameContainer.classList.remove('hidden');
      trackerPanel.classList.remove('hidden');

      summaryBox.innerHTML = '🎮 遊戲進行中... (In Progress)';

      gameTimer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnLoop();
    }

    function spawnLoop() {
      if (timeLeft <= 0) return;

      popRandomMole();
      const delay = Math.floor(Math.random() * 600) + 700; 
      spawnTimer = setTimeout(spawnLoop, delay);
    }

    function popRandomMole() {
      const availableHoles = [];
      for (let i = 0; i < 5; i++) {
        if (!activeMoles[i]) availableHoles.push(i);
      }

      if (availableHoles.length === 0) return;

      const holeIndex = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      
      const isTarget = Math.random() < 0.6;
      let chosenClassifier = targetClassifier;

      if (!isTarget) {
        const otherClassifiers = Object.keys(itemsDatabase).filter(c => c !== targetClassifier);
        chosenClassifier = otherClassifiers[Math.floor(Math.random() * otherClassifiers.length)];
      }

      const pool = itemsDatabase[chosenClassifier];
      const pickedItem = pool[Math.floor(Math.random() * pool.length)];

      const moleElem = document.getElementById(`mole-${holeIndex}`);
      const imgElem = document.getElementById(`img-${holeIndex}`);

      imgElem.src = pickedItem.src;

      activeMoles[holeIndex] = {
        item: pickedItem,
        classifier: chosenClassifier,
        isTarget: isTarget,
        hit: false
      };

      moleElem.classList.add('up');

      setTimeout(() => {
        if (activeMoles[holeIndex] && !activeMoles[holeIndex].hit) {
          moleElem.classList.remove('up');
          delete activeMoles[holeIndex];
        }
      }, 1800);
    }

    function whackMole(holeIndex) {
      const moleData = activeMoles[holeIndex];
      if (!moleData || moleData.hit) return;

      moleData.hit = true;
      const moleElem = document.getElementById(`mole-${holeIndex}`);

      const fullText = `一${moleData.classifier}${moleData.item.name}`;
      if (!trackedSessionData[fullText]) {
        trackedSessionData[fullText] = { 
          name: moleData.item.name, 
          classifier: moleData.classifier, 
          isTarget: moleData.isTarget, 
          hits: 0, 
          wrongHits: 0 
        };
      }

      if (moleData.isTarget) {
        score += 1;
        trackedSessionData[fullText].hits += 1;
        showHitFx(holeIndex, '+1', true);
      } else {
        score = Math.max(0, score - 1);
        trackedSessionData[fullText].wrongHits += 1;
        showHitFx(holeIndex, '-1', false);
      }

      scoreDisplay.textContent = score;

      moleElem.classList.remove('up');
      delete activeMoles[holeIndex];
    }

    function showHitFx(holeIndex, text, isCorrect) {
      const spotElem = document.querySelector(`.spot-${holeIndex}`);
      const fx = document.createElement('div');
      fx.className = `hit-fx ${isCorrect ? 'correct' : 'wrong'}`;
      fx.textContent = text;
      spotElem.appendChild(fx);

      setTimeout(() => fx.remove(), 600);
    }

    function endGame() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      renderTrackerSummary();
    }

    function stopAndResetToSetup() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      gameContainer.classList.add('hidden');
      gameControls.classList.add('hidden');
      trackerPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    }

    function renderTrackerSummary() {
      let targetHits = 0;
      let distractorHits = 0;
      let targetItemsList = [];

      Object.values(trackedSessionData).forEach(entry => {
        if (entry.isTarget) {
          targetHits += entry.hits;
          if (entry.hits > 0) {
            targetItemsList.push(`一${entry.classifier}${entry.name} (${entry.hits}次)`);
          }
        } else {
          distractorHits += entry.wrongHits;
        }
      });

      const totalAttempts = targetHits + distractorHits;
      const accuracy = totalAttempts > 0 ? Math.round((targetHits / totalAttempts) * 100) : 0;

      let html = `<div>🏆 <b>遊戲完成！最終得分：${score} 分</b></div>`;
      html += `<div>🎯 目標量詞：「<b>${targetClassifier}</b>」</div>`;
      html += `<div>📊 辨識正確率：<b>${targetHits}/${totalAttempts} (${accuracy}%)</b></div>`;
      
      if (targetItemsList.length > 0) {
        html += `<div style="margin-top:6px; font-weight:normal; color:#2D6A4F; font-size:0.88rem;">成功擊中之目標詞彙：${targetItemsList.join('、')}</div>`;
      }
      
      if (distractorHits > 0) {
        html += `<div style="margin-top:4px; font-weight:normal; color:#E53E3E; font-size:0.88rem;">誤擊非目標量詞次數：${distractorHits} 次</div>`;
      }

      summaryBox.innerHTML = html;
    }

    function exportTrackerAsImage() {
      const name = childNameInput.value.trim() || '未命名';
      
      html2canvas(trackerPanel, {
        useCORS: true,
        scale: 2,
        backgroundColor: '#FFFFFF'
      }).then(canvas => {
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        link.download = `打地鼠量詞紀錄_${name}_${dateStr}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => {
        alert('匯出圖片時發生錯誤，請稍後再試。');
      });
    }
  </script>
</body>
</html>
