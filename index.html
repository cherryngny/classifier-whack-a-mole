<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese Classifier Whack-a-Mole - SLP Deluxe Edition</title>
  <!-- html2canvas for exporting performance report as image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #3A7CA5;
      --secondary: #48BB78;
      --accent: #E53E3E;
      --text: #2D3748;
    }

    body {
      font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #F4F7F6;
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    h1 {
      margin: 5px 0 12px 0;
      color: #2D6A4F;
      text-align: center;
      font-size: 1.8rem;
    }

    .setup-panel, .tracker-panel {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      max-width: 640px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #E2E8F0;
    }

    .form-group { margin-bottom: 16px; }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
      color: #2D6A4F;
    }

    .radio-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .radio-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #F0F7F4;
      border: 2px solid #B7E4C7;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2D6A4F;
      transition: all 0.2s ease;
    }

    .radio-btn input { display: none; }

    .radio-btn.selected {
      background: #52B788;
      color: white;
      border-color: #2D6A4F;
      box-shadow: 0 4px 10px rgba(82, 183, 136, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      background: #40916C;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(64, 145, 108, 0.3);
    }

    button:hover { background: #2D6A4F; }

    /* Farm Game Environment Container */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 500px;
      background: linear-gradient(to bottom, #C0E8F9 0%, #E2F0D9 35%, #95D5B2 100%);
      border-radius: 20px;
      border: 6px solid #74C69D;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      margin-bottom: 15px;
    }

    /* Scattered Mole Holes Layout */
    .mole-spot {
      position: absolute;
      width: 140px;
      height: 220px;
    }

    .spot-0 { top: 160px; left: 6%; z-index: 5; }
    .spot-1 { top: 150px; right: 8%; z-index: 5; }
    .spot-2 { top: 230px; left: 36%; z-index: 6; }
    .spot-3 { top: 285px; left: 10%; z-index: 7; }
    .spot-4 { top: 295px; right: 12%; z-index: 7; }

    .clipping-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
      clip-path: inset(0 0 0 0); 
    }

    .hole-mound {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 44px;
      background: radial-gradient(ellipse at center, #5C3D2E 0%, #3D2314 100%);
      border-radius: 50%;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.8), 0 4px 0 #2D6A4F;
      z-index: 10;
    }

    .grass-tuft {
      position: absolute;
      bottom: 4px;
      width: 100%;
      height: 14px;
      z-index: 11;
      pointer-events: none;
    }

    .grass-tuft::before, .grass-tuft::after {
      content: '';
      position: absolute;
      bottom: 0;
      background: #1B4332;
      border-radius: 10px 10px 0 0;
    }
    .grass-tuft::before { left: 8px; width: 7px; height: 16px; transform: rotate(-20deg); }
    .grass-tuft::after { right: 10px; width: 7px; height: 18px; transform: rotate(20deg); }

    /* MOLE CHARACTER */
    .mole {
      position: absolute;
      bottom: -200px;
      left: 33px;
      width: 74px;
      height: 105px;
      background: linear-gradient(to right, #8D6E63, #5D4037);
      border-radius: 37px 37px 12px 12px;
      opacity: 0;
      pointer-events: none; 
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      box-shadow: inset -5px -4px 0 rgba(0,0,0,0.3);
    }

    .mole.up {
      transform: translateY(-265px);
      opacity: 1;
      pointer-events: auto;
    }

    .mole-card-wrapper {
      position: absolute;
      top: -100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }

    .mole-card {
      width: 76px;
      height: 76px;
      background: white;
      border: 3.5px solid var(--primary);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      padding: 4px;
      box-sizing: border-box;
      pointer-events: auto;
    }

    .mole-stick {
      width: 5px;
      height: 30px;
      background: #8D5B4C;
      border-radius: 2px;
      margin-top: -4px;
    }

    .mole-img-box {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mole-img-box svg {
      width: 100%;
      height: 100%;
    }

    .mole-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #2D3748;
      margin-top: 1px;
    }

    /* FACIAL FEATURES */
    .mole-ear {
      position: absolute;
      top: 10px;
      width: 12px;
      height: 14px;
      background: #D7CCC8;
      border-radius: 50%;
      border: 2px solid #5D4037;
    }
    .mole-ear.left { left: -3px; }
    .mole-ear.right { right: -3px; }

    .mole-eyes-container {
      position: absolute;
      top: 26px;
      width: 44px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }

    .mole-eye {
      width: 9px;
      height: 9px;
      background: #111;
      border-radius: 50%;
      position: relative;
    }
    
    .mole-eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
    }

    .mole-snout {
      width: 36px;
      height: 22px;
      background: #E0D6D3;
      border-radius: 14px;
      margin-top: 36px;
      position: relative;
      display: flex;
      justify-content: center;
      z-index: 3;
    }

    .mole-nose {
      width: 12px;
      height: 9px;
      background: #FFB5A7;
      border-radius: 6px;
      position: absolute;
      top: 2px;
    }

    /* Whack FX */
    .hit-fx {
      position: absolute;
      top: -115px;
      font-size: 1.8rem;
      font-weight: bold;
      pointer-events: none;
      animation: popAndFade 0.6s forwards;
      z-index: 30;
    }
    .hit-fx.correct { color: #2ECC71; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .hit-fx.wrong { color: #E53E3E; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }

    @keyframes popAndFade {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-35px) scale(1.3); }
    }

    /* Scoreboard & Controls */
    .game-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      width: 100%;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .score-badge {
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #52B788;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>打地鼠量詞識別遊戲</h1>

  <!-- Setup Panel -->
  <div id="setup-panel" class="setup-panel">
    <div class="form-group">
      <label>1. 選擇目標量詞 (Target Classifier)：</label>

        <label class="radio-btn"><input type="radio" name="classifier" value="條">條</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="件">件</label>

        <label class="radio-btn"><input type="radio" name="classifier" value="粒">粒</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="架">架</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="張">張</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="塊">塊</label>

    </div>

    <button id="start-btn">開始遊戲 Start Game</button>

      '架': [
        { name: '車', svg: `<svg viewBox="0 0 64 64"><path d="M12 34l6-10h28l6 10v12H12V34z" fill="#E53E3E"/><circle cx="20" cy="46" r="6" fill="#2D3748"/><circle cx="44" cy="46" r="6" fill="#2D3748"/><rect x="22" y="26" width="8" height="6" fill="#E2E8F0"/><rect x="34" y="26" width="8" height="6" fill="#E2E8F0"/></svg>` },
        { name: '飛機', svg: `<svg viewBox="0 0 64 64"><path d="M8 32l48-8v16L8 32z" fill="#CBD5E0"/><path d="M28 12l8 16H24l4-16zM28 52l8-16H24l4 16z" fill="#A0AEC0"/></svg>` },
        { name: '單車', svg: `<svg viewBox="0 0 64 64"><circle cx="18" cy="38" r="10" stroke="#2D3748" stroke-width="4" fill="none"/><circle cx="46" cy="38" r="10" stroke="#2D3748" stroke-width="4" fill="none"/><path d="M18 38l10-14h12l6 14M28 24l8 14" stroke="#E53E3E" stroke-width="4" fill="none"/></svg>` }
      ],
      '張': [
        { name: '紙巾', svg: `<svg viewBox="0 0 64 64"><rect x="14" y="28" width="36" height="20" rx="3" fill="#CBD5E0"/><path d="M22 28c4-12 16-12 20 0H22z" fill="#EDF2F7"/></svg>` },
        { name: '櫈', svg: `<svg viewBox="0 0 64 64"><rect x="18" y="22" width="28" height="6" rx="2" fill="#DD6B20"/><path d="M22 28v22M42 28v22" stroke="#744210" stroke-width="4"/></svg>` },
        { name: '床', svg: `<svg viewBox="0 0 64 64"><rect x="10" y="30" width="44" height="12" fill="#3182CE"/><rect x="14" y="24" width="12" height="8" rx="2" fill="#EDF2F7"/><path d="M10 20v24M54 30v14" stroke="#2D3748" stroke-width="4"/></svg>` }
      ],
      '塊': [
        { name: '餅乾', svg: `<svg viewBox="0 0 64 64"><rect x="16" y="16" width="32" height="32" rx="6" fill="#D69E2E"/><circle cx="24" cy="24" r="2" fill="#744210"/><circle cx="40" cy="24" r="2" fill="#744210"/><circle cx="32" cy="32" r="2" fill="#744210"/><circle cx="24" cy="40" r="2" fill="#744210"/><circle cx="40" cy="40" r="2" fill="#744210"/></svg>` },
        { name: '鏡子', svg: `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="26" rx="14" ry="18" fill="#BEE3F8" stroke="#DD6B20" stroke-width="4"/><path d="M32 44v10" stroke="#DD6B20" stroke-width="4"/></svg>` },
        { name: '披薩', svg: `<svg viewBox="0 0 64 64"><polygon points="32,12 12,48 52,48" fill="#F6AD55"/><path d="M12 48c10 4 30 4 40 0" stroke="#C05621" stroke-width="6" fill="none"/><circle cx="28" cy="32" r="3" fill="#E53E3E"/><circle cx="36" cy="40" r="3" fill="#E53E3E"/></svg>` }
      ]
    };

    // Game State
    let targetClassifier = '個';
    let score = 0;
    let timeLeft = 45;
    let gameTimer = null;
    let spawnTimer = null;
    let activeMoles = {};
    let trackedSessionData = {};

    // DOM Elements
    const setupPanel = document.getElementById('setup-panel');
    const gameControls = document.getElementById('game-controls');
    const gameContainer = document.getElementById('game-container');
    const trackerPanel = document.getElementById('tracker-panel');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const exportImgBtn = document.getElementById('export-img-btn');
    const targetDisplay = document.getElementById('target-display');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const summaryBox = document.getElementById('summary-box');
    const childNameInput = document.getElementById('child-name');

    // Radio button handler
    const radioLabels = document.querySelectorAll('#classifier-options .radio-btn');
    radioLabels.forEach(label => {
      label.addEventListener('click', () => {
        radioLabels.forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        const radioInput = label.querySelector('input');
        radioInput.checked = true;
        targetClassifier = radioInput.value;
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', stopAndResetToSetup);
    exportImgBtn.addEventListener('click', exportTrackerAsImage);

    // Attach Mole Listeners
    for (let i = 0; i < 5; i++) {
      const moleElem = document.getElementById(`mole-${i}`);
      moleElem.addEventListener('click', () => whackMole(i));
    }

    function startGame() {
      score = 0;
      timeLeft = 45;
      activeMoles = {};
      trackedSessionData = {};

      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      targetDisplay.textContent = targetClassifier;

      setupPanel.classList.add('hidden');
      gameControls.classList.remove('hidden');
      gameContainer.classList.remove('hidden');
      trackerPanel.classList.remove('hidden');

      summaryBox.innerHTML = '🎮 遊戲進行中... (In Progress)';

      // Timer
      gameTimer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnLoop();
    }

    function spawnLoop() {
      if (timeLeft <= 0) return;

      popRandomMole();
      const delay = Math.floor(Math.random() * 600) + 700; 
      spawnTimer = setTimeout(spawnLoop, delay);
    }

    function popRandomMole() {
      const availableHoles = [];
      for (let i = 0; i < 5; i++) {
        if (!activeMoles[i]) availableHoles.push(i);
      }

      if (availableHoles.length === 0) return;

      const holeIndex = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      
      const isTarget = Math.random() < 0.6;
      let chosenClassifier = targetClassifier;

      if (!isTarget) {
        const otherClassifiers = Object.keys(itemsDatabase).filter(c => c !== targetClassifier);
        chosenClassifier = otherClassifiers[Math.floor(Math.random() * otherClassifiers.length)];
      }

      const pool = itemsDatabase[chosenClassifier];
      const pickedItem = pool[Math.floor(Math.random() * pool.length)];

      const moleElem = document.getElementById(`mole-${holeIndex}`);
      const imgBox = document.getElementById(`img-${holeIndex}`);
      const labelBox = document.getElementById(`label-${holeIndex}`);

      // Inject SVG Vector Graphic
      imgBox.innerHTML = pickedItem.svg;
      labelBox.textContent = pickedItem.name;

      activeMoles[holeIndex] = {
        item: pickedItem,
        classifier: chosenClassifier,
        isTarget: isTarget,
        hit: false
      };

      moleElem.classList.add('up');

      setTimeout(() => {
        if (activeMoles[holeIndex] && !activeMoles[holeIndex].hit) {
          moleElem.classList.remove('up');
          delete activeMoles[holeIndex];
        }
      }, 1800);
    }

    function whackMole(holeIndex) {
      const moleData = activeMoles[holeIndex];
      if (!moleData || moleData.hit) return;

      moleData.hit = true;
      const moleElem = document.getElementById(`mole-${holeIndex}`);

      const fullText = `一${moleData.classifier}${moleData.item.name}`;
      if (!trackedSessionData[fullText]) {
        trackedSessionData[fullText] = { 
          name: moleData.item.name, 
          classifier: moleData.classifier, 
          isTarget: moleData.isTarget, 
          hits: 0, 
          wrongHits: 0 
        };
      }

      if (moleData.isTarget) {
        score += 1;
        trackedSessionData[fullText].hits += 1;
        showHitFx(holeIndex, '+1', true);
      } else {
        score = Math.max(0, score - 1);
        trackedSessionData[fullText].wrongHits += 1;
        showHitFx(holeIndex, '-1', false);
      }

      scoreDisplay.textContent = score;

      moleElem.classList.remove('up');
      delete activeMoles[holeIndex];
    }

    function showHitFx(holeIndex, text, isCorrect) {
      const spotElem = document.querySelector(`.spot-${holeIndex}`);
      const fx = document.createElement('div');
      fx.className = `hit-fx ${isCorrect ? 'correct' : 'wrong'}`;
      fx.textContent = text;
      spotElem.appendChild(fx);

      setTimeout(() => fx.remove(), 600);
    }

    function endGame() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      renderTrackerSummary();
    }

    function stopAndResetToSetup() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      gameContainer.classList.add('hidden');
      gameControls.classList.add('hidden');
      trackerPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    }

    function renderTrackerSummary() {
      let targetHits = 0;
      let distractorHits = 0;
      let targetItemsList = [];

      Object.values(trackedSessionData).forEach(entry => {
        if (entry.isTarget) {
          targetHits += entry.hits;
          if (entry.hits > 0) {
            targetItemsList.push(`一${entry.classifier}${entry.name} (${entry.hits}次)`);
          }
        } else {
          distractorHits += entry.wrongHits;
        }
      });

      const totalAttempts = targetHits + distractorHits;
      const accuracy = totalAttempts > 0 ? Math.round((targetHits / totalAttempts) * 100) : 0;

      let html = `<div>🏆 <b>遊戲完成！最終得分：${score} 分</b></div>`;
      html += `<div>🎯 目標量詞：「<b>${targetClassifier}</b>」</div>`;
      html += `<div>📊 辨識正確率：<b>${targetHits}/${totalAttempts} (${accuracy}%)</b></div>`;
      
      if (targetItemsList.length > 0) {
        html += `<div style="margin-top:6px; font-weight:normal; color:#2D6A4F; font-size:0.88rem;">成功擊中之目標詞彙：${targetItemsList.join('、')}</div>`;
      }
      
      if (distractorHits > 0) {
        html += `<div style="margin-top:4px; font-weight:normal; color:#E53E3E; font-size:0.88rem;">誤擊非目標量詞次數：${distractorHits} 次</div>`;
      }

      summaryBox.innerHTML = html;
    }

    function exportTrackerAsImage() {
      const name = childNameInput.value.trim() || '未命名';
      
      html2canvas(trackerPanel, {
        useCORS: true,
        scale: 2,
        backgroundColor: '#FFFFFF'
      }).then(canvas => {
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        link.download = `打地鼠量詞紀錄_${name}_${dateStr}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => {
        alert('匯出圖片時發生錯誤，請稍後再試。');
      });
    }
  </script>
</body>
</html>
