<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese Classifier Whack-a-Mole - SLP Deluxe Edition</title>
  <!-- html2canvas for exporting performance report as image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #3A7CA5;
      --secondary: #48BB78;
      --accent: #E53E3E;
      --text: #2D3748;
    }

    body {
      font-family: "PingFang HK", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F7F6;
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    h1 {
      margin: 5px 0 12px 0;
      color: #2D6A4F;
      text-align: center;
      font-size: 1.8rem;
    }

    .setup-panel, .tracker-panel {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      max-width: 640px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #E2E8F0;
    }

    .form-group { margin-bottom: 16px; }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
      color: #2D6A4F;
    }

    .radio-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .radio-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #F0F7F4;
      border: 2px solid #B7E4C7;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2D6A4F;
      transition: all 0.2s ease;
    }

    .radio-btn input { display: none; }

    .radio-btn.selected {
      background: #52B788;
      color: white;
      border-color: #2D6A4F;
      box-shadow: 0 4px 10px rgba(82, 183, 136, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      background: #40916C;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(64, 145, 108, 0.3);
    }

    button:hover { background: #2D6A4F; }

    /* Farm Game Environment Container */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 500px;
      background: linear-gradient(to bottom, #C0E8F9 0%, #E2F0D9 35%, #95D5B2 100%);
      border-radius: 20px;
      border: 6px solid #74C69D;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      margin-bottom: 15px;
    }

    /* Scattered Mole Holes Layout */
    .mole-spot {
      position: absolute;
      width: 140px;
      height: 220px;
    }

    .spot-0 { top: 160px; left: 6%; z-index: 5; }
    .spot-1 { top: 150px; right: 8%; z-index: 5; }
    .spot-2 { top: 230px; left: 36%; z-index: 6; }
    .spot-3 { top: 285px; left: 10%; z-index: 7; }
    .spot-4 { top: 295px; right: 12%; z-index: 7; }

    .clipping-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
      clip-path: inset(0 0 0 0); 
    }

    .hole-mound {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 44px;
      background: radial-gradient(ellipse at center, #5C3D2E 0%, #3D2314 100%);
      border-radius: 50%;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.8), 0 4px 0 #2D6A4F;
      z-index: 10;
    }

    .grass-tuft {
      position: absolute;
      bottom: 4px;
      width: 100%;
      height: 14px;
      z-index: 11;
      pointer-events: none;
    }

    .grass-tuft::before, .grass-tuft::after {
      content: '';
      position: absolute;
      bottom: 0;
      background: #1B4332;
      border-radius: 10px 10px 0 0;
    }
    .grass-tuft::before { left: 8px; width: 7px; height: 16px; transform: rotate(-20deg); }
    .grass-tuft::after { right: 10px; width: 7px; height: 18px; transform: rotate(20deg); }

    /* MOLE CHARACTER */
    .mole {
      position: absolute;
      bottom: -200px;
      left: 33px;
      width: 74px;
      height: 105px;
      background: linear-gradient(to right, #8D6E63, #5D4037);
      border-radius: 37px 37px 12px 12px;
      opacity: 0;
      pointer-events: none; 
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      box-shadow: inset -5px -4px 0 rgba(0,0,0,0.3);
    }

    .mole.up {
      transform: translateY(-265px);
      opacity: 1;
      pointer-events: auto;
    }

    .mole-card-wrapper {
      position: absolute;
      top: -100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 15; /* HIGHER than mound (z:10) to bring sign to front */
      pointer-events: none;
    }

    .mole-card {
      width: 76px;
      height: 76px;
      background: white;
      border: 3.5px solid var(--primary);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      padding: 2px;
      box-sizing: border-box;
      pointer-events: auto;
    }

    .mole-stick {
      width: 5px;
      height: 30px;
      background: #8D5B4C;
      border-radius: 2px;
      margin-top: -4px;
    }

    .mole-emoji-box {
      font-size: 2.2rem;
      line-height: 1;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mole-label {
      font-size: 0.8rem;
      font-weight: bold;
      color: #2D3748;
      margin-top: 1px;
    }

    /* FACIAL FEATURES */
    .mole-ear {
      position: absolute;
      top: 10px;
      width: 12px;
      height: 14px;
      background: #D7CCC8;
      border-radius: 50%;
      border: 2px solid #5D4037;
    }
    .mole-ear.left { left: -3px; }
    .mole-ear.right { right: -3px; }

    .mole-eyes-container {
      position: absolute;
      top: 26px;
      width: 44px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }

    .mole-eye {
      width: 9px;
      height: 9px;
      background: #111;
      border-radius: 50%;
      position: relative;
    }
    
    .mole-eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
    }

    .mole-snout {
      width: 36px;
      height: 22px;
      background: #E0D6D3;
      border-radius: 14px;
      margin-top: 36px;
      position: relative;
      display: flex;
      justify-content: center;
      z-index: 3;
    }

    .mole-nose {
      width: 12px;
      height: 9px;
      background: #FFB5A7;
      border-radius: 6px;
      position: absolute;
      top: 2px;
    }

    /* Whack FX */
    .hit-fx {
      position: absolute;
      top: -115px;
      font-size: 1.8rem;
      font-weight: bold;
      pointer-events: none;
      animation: popAndFade 0.6s forwards;
      z-index: 30;
    }
    .hit-fx.correct { color: #2ECC71; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .hit-fx.wrong { color: #E53E3E; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }

    @keyframes popAndFade {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-35px) scale(1.3); }
    }

    /* Scoreboard & Controls */
    .game-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      width: 100%;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .score-badge {
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #52B788;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>打地鼠量詞識別遊戲</h1>

  <!-- Setup Panel -->
  <div id="setup-panel" class="setup-panel">
    <div class="form-group">
      <label>1. 選擇目標量詞 (Target Classifier)：</label>
      <div class="radio-group" id="classifier-options">
        <label class="radio-btn selected"><input type="radio" name="classifier" value="個" checked>個</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="條">條</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="件">件</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="隻">隻</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="粒">粒</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="架">架</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="張">張</label>
        <label class="radio-btn"><input type="radio" name="classifier" value="塊">塊</label>
      </div>
    </div>

    <button id="start-btn">開始遊戲 Start Game</button>
  </div>

  <!-- Game Controls Bar -->
  <div id="game-controls" class="game-controls hidden">
    <button id="reset-btn" style="width: auto; padding: 6px 16px; font-size: 0.9rem;">← 返回設定 Setup</button>
    <div class="score-badge">目標量詞: <span id="target-display" style="color:#2D6A4F;">-</span></div>
    <div class="score-badge">得分: <span id="score-display" style="color:var(--primary);">0</span></div>
    <div class="score-badge">剩餘時間: <span id="timer-display" style="color:var(--accent);">45</span>s</div>
  </div>

  <!-- Game Field Container -->
  <div id="game-container" class="game-container hidden">
    <!-- 5 Scattered Mole Holes -->
    <div class="mole-spot spot-0">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-0">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <div class="mole-emoji-box" id="emoji-0">🍎</div>
              <div class="mole-label" id="label-0">蘋果</div>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-1">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-1">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <div class="mole-emoji-box" id="emoji-1">🍊</div>
              <div class="mole-label" id="label-1">橙</div>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-2">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-2">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <div class="mole-emoji-box" id="emoji-2">🍰</div>
              <div class="mole-label" id="label-2">蛋糕</div>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-3">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-3">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <div class="mole-emoji-box" id="emoji-3">⚽</div>
              <div class="mole-label" id="label-3">波</div>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>

    <div class="mole-spot spot-4">
      <div class="clipping-wrapper">
        <div class="mole" id="mole-4">
          <div class="mole-card-wrapper">
            <div class="mole-card">
              <div class="mole-emoji-box" id="emoji-4">🍔</div>
              <div class="mole-label" id="label-4">漢堡包</div>
            </div>
            <div class="mole-stick"></div>
          </div>
          <div class="mole-ear left"></div><div class="mole-ear right"></div>
          <div class="mole-eyes-container"><div class="mole-eye"></div><div class="mole-eye"></div></div>
          <div class="mole-snout"><div class="mole-nose"></div></div>
        </div>
      </div>
      <div class="hole-mound"></div>
      <div class="grass-tuft"></div>
    </div>
  </div>

  <!-- Tracker Panel -->
  <div id="tracker-panel" class="tracker-panel hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #BBF7D0; padding-bottom:8px; margin-bottom:14px;">
      <h2 style="margin:0; font-size:1.25rem; color:#2D6A4F;">紀錄面板 (Data Tracker)</h2>
      <button id="export-img-btn" style="width:auto; padding:6px 14px; font-size:0.85rem; background:#276749;">📷 匯出紀錄圖片 (Export Image)</button>
    </div>

    <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
      <label for="child-name" style="margin: 0; white-space: nowrap;">學生/兒童名字 (Name):</label>
      <input type="text" id="child-name" placeholder="請輸入名字..." style="padding: 6px 10px; width: 100%; border-radius: 6px; border: 1px solid #CCC;">
    </div>

    <div id="summary-box" style="background:white; padding:14px; border-radius:10px; font-weight:bold; font-size:0.95rem; border:1px dashed #38A169; line-height:1.6;">遊戲尚未完成</div>
  </div>

  <script>
    // Bulletproof Emoji Database
    const itemsDatabase = {
      '個': [
        { name: '泡泡', icon: '🫧' },
        { name: '橙', icon: '🍊' },
        { name: '蛋糕', icon: '🎂' },
        { name: '波', icon: '⚽' },
        { name: '漢堡包', icon: '🍔' },
        { name: '鐘', icon: '⏰' },
        { name: '醫生', icon: '🧑🏻‍⚕️' },
        { name: '廚師', icon: '🧑🏻‍🍳' },
      ],
      '條': [
        { name: '魚', icon: '🐟' },
        { name: '香蕉', icon: '🍌' },
        { name: '褲', icon: '👖' },
        { name: '頸巾', icon: '🧣' },
        { name: '彩虹', icon: '🌈' },
        { name: '蛇', icon: '🐍' },
        { name: '裙', icon: '👗' },
        { name: '海豚', icon: '🐬' }
      ],
      '件': [
        { name: '衫', icon: '👕' },
        { name: '衫', icon: '👚' },
        { name: '袍', icon: '🥼' },
        { name: '背心', icon: '🦺' },
        { name: '外套', icon: '🧥' },
        { name: '泳衣', icon: '🩱' },
      ],
      '隻': [
        { name: '狗', icon: '🐶' },
        { name: '貓', icon: '🐱' },
        { name: '雀仔', icon: '🐦' },
        { name: '兔子', icon: '🐰' },
        { name: '烏龜', icon: '🐢' },
        { name: '大象', icon: '🐘' },
        { name: '鴨仔', icon: '🦆' },
      ],
      '粒': [
        { name: '糖', icon: '🍬' },
        { name: '紅豆', icon: '🫘' },
        { name: '草莓', icon: '🍓' },
        { name: '花生', icon: '🥜' },
        { name: '藥丸', icon: '💊' },
        { name: '車厘子', icon: '🍒' }
      ],
      '架': [
        { name: '車', icon: '🚗' },
        { name: '飛機', icon: '✈️' },
        { name: '單車', icon: '🚲' },
        { name: '巴士', icon: '🚌' },
        { name: '直升機', icon: '🚁' },
        { name: '消防車', icon: '🚒' }
        { name: '地鐵', icon: '🚊' }
        { name: '貨車', icon: '🚛' }
      ],
      '張': [
        { name: '紙', icon: '📄' },
        { name: '櫈', icon: '🪑' },
        { name: '床', icon: '🛏️' },
        { name: '梳化', icon: '🛋️' },
        { name: '卡', icon: '🪪' },
        { name: '卡片', icon: '💳' }
      ],
      '塊': [
        { name: '餅乾', icon: '🍪' },
        { name: '鏡子', icon: '🪞' },
        { name: '披薩', icon: '🍕' },
        { name: '朱古力', icon: '🍫' },
        { name: '樹葉', icon: '🍃' },
        { name: '拼圖', icon: '🧩' }
      ]
    };

    // Game State
    let targetClassifier = '個';
    let score = 0;
    let timeLeft = 45;
    let gameTimer = null;
    let spawnTimer = null;
    let activeMoles = {};
    let trackedSessionData = {};

    // DOM Elements
    const setupPanel = document.getElementById('setup-panel');
    const gameControls = document.getElementById('game-controls');
    const gameContainer = document.getElementById('game-container');
    const trackerPanel = document.getElementById('tracker-panel');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const exportImgBtn = document.getElementById('export-img-btn');
    const targetDisplay = document.getElementById('target-display');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const summaryBox = document.getElementById('summary-box');
    const childNameInput = document.getElementById('child-name');

    // Radio option setup
    const radioLabels = document.querySelectorAll('#classifier-options .radio-btn');
    radioLabels.forEach(label => {
      label.addEventListener('click', () => {
        radioLabels.forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
        const radioInput = label.querySelector('input');
        radioInput.checked = true;
        targetClassifier = radioInput.value;
      });
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', stopAndResetToSetup);
    exportImgBtn.addEventListener('click', exportTrackerAsImage);

    // Attach Mole Listeners
    for (let i = 0; i < 5; i++) {
      const moleElem = document.getElementById(`mole-${i}`);
      moleElem.addEventListener('click', () => whackMole(i));
    }

    function startGame() {
      score = 0;
      timeLeft = 45;
      activeMoles = {};
      trackedSessionData = {};

      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      targetDisplay.textContent = targetClassifier;

      setupPanel.classList.add('hidden');
      gameControls.classList.remove('hidden');
      gameContainer.classList.remove('hidden');
      trackerPanel.classList.remove('hidden');

      summaryBox.innerHTML = '🎮 遊戲進行中... (In Progress)';

      // Countdown Timer
      gameTimer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnLoop();
    }

    function spawnLoop() {
      if (timeLeft <= 0) return;

      popRandomMole();
      const delay = Math.floor(Math.random() * 600) + 700; 
      spawnTimer = setTimeout(spawnLoop, delay);
    }

    function popRandomMole() {
      const availableHoles = [];
      for (let i = 0; i < 5; i++) {
        if (!activeMoles[i]) availableHoles.push(i);
      }

      if (availableHoles.length === 0) return;

      const holeIndex = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      
      const isTarget = Math.random() < 0.6;
      let chosenClassifier = targetClassifier;

      if (!isTarget) {
        const otherClassifiers = Object.keys(itemsDatabase).filter(c => c !== targetClassifier);
        chosenClassifier = otherClassifiers[Math.floor(Math.random() * otherClassifiers.length)];
      }

      const pool = itemsDatabase[chosenClassifier];
      const pickedItem = pool[Math.floor(Math.random() * pool.length)];

      const moleElem = document.getElementById(`mole-${holeIndex}`);
      const emojiBox = document.getElementById(`emoji-${holeIndex}`);
      const labelBox = document.getElementById(`label-${holeIndex}`);

      emojiBox.textContent = pickedItem.icon;
      labelBox.textContent = pickedItem.name;

      activeMoles[holeIndex] = {
        item: pickedItem,
        classifier: chosenClassifier,
        isTarget: isTarget,
        hit: false
      };

      moleElem.classList.add('up');

      setTimeout(() => {
        if (activeMoles[holeIndex] && !activeMoles[holeIndex].hit) {
          moleElem.classList.remove('up');
          delete activeMoles[holeIndex];
        }
      }, 1800);
    }

    function whackMole(holeIndex) {
      const moleData = activeMoles[holeIndex];
      if (!moleData || moleData.hit) return;

      moleData.hit = true;
      const moleElem = document.getElementById(`mole-${holeIndex}`);

      const fullText = `一${moleData.classifier}${moleData.item.name}`;
      if (!trackedSessionData[fullText]) {
        trackedSessionData[fullText] = { 
          name: moleData.item.name, 
          classifier: moleData.classifier, 
          isTarget: moleData.isTarget, 
          hits: 0, 
          wrongHits: 0 
        };
      }

      if (moleData.isTarget) {
        score += 1;
        trackedSessionData[fullText].hits += 1;
        showHitFx(holeIndex, '+1', true);
      } else {
        score = Math.max(0, score - 1);
        trackedSessionData[fullText].wrongHits += 1;
        showHitFx(holeIndex, '-1', false);
      }

      scoreDisplay.textContent = score;

      moleElem.classList.remove('up');
      delete activeMoles[holeIndex];
    }

    function showHitFx(holeIndex, text, isCorrect) {
      const spotElem = document.querySelector(`.spot-${holeIndex}`);
      const fx = document.createElement('div');
      fx.className = `hit-fx ${isCorrect ? 'correct' : 'wrong'}`;
      fx.textContent = text;
      spotElem.appendChild(fx);

      setTimeout(() => fx.remove(), 600);
    }

    function endGame() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      renderTrackerSummary();
    }

    function stopAndResetToSetup() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);

      for (let i = 0; i < 5; i++) {
        document.getElementById(`mole-${i}`).classList.remove('up');
      }

      gameContainer.classList.add('hidden');
      gameControls.classList.add('hidden');
      trackerPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    }

    function renderTrackerSummary() {
      let targetHits = 0;
      let distractorHits = 0;
      let targetItemsList = [];

      Object.values(trackedSessionData).forEach(entry => {
        if (entry.isTarget) {
          targetHits += entry.hits;
          if (entry.hits > 0) {
            targetItemsList.push(`一${entry.classifier}${entry.name} (${entry.hits}次)`);
          }
        } else {
          distractorHits += entry.wrongHits;
        }
      });

      const totalAttempts = targetHits + distractorHits;
      const accuracy = totalAttempts > 0 ? Math.round((targetHits / totalAttempts) * 100) : 0;

      let html = `<div>🏆 <b>遊戲完成！最終得分：${score} 分</b></div>`;
      html += `<div>🎯 目標量詞：「<b>${targetClassifier}</b>」</div>`;
      html += `<div>📊 辨識正確率：<b>${targetHits}/${totalAttempts} (${accuracy}%)</b></div>`;
      
      if (targetItemsList.length > 0) {
        html += `<div style="margin-top:6px; font-weight:normal; color:#2D6A4F; font-size:0.88rem;">成功擊中之目標詞彙：${targetItemsList.join('、')}</div>`;
      }
      
      if (distractorHits > 0) {
        html += `<div style="margin-top:4px; font-weight:normal; color:#E53E3E; font-size:0.88rem;">誤擊非目標量詞次數：${distractorHits} 次</div>`;
      }

      summaryBox.innerHTML = html;
    }

    function exportTrackerAsImage() {
      const name = childNameInput.value.trim() || '未命名';
      
      html2canvas(trackerPanel, {
        useCORS: true,
        scale: 2,
        backgroundColor: '#FFFFFF'
      }).then(canvas => {
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        link.download = `打地鼠量詞紀錄_${name}_${dateStr}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => {
        alert('匯出圖片時發生錯誤，請稍後再試。');
      });
    }
  </script>
</body>
</html>
